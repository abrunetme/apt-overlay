name: Update APT Repository

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Debian development utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils curl gzip

      - name: Setup GitHub Pages infrastructure
        id: configure
        uses: actions/configure-pages@v6

      - name: Restore previous APT repository from GitHub Pages
        env:
          PAGES_URL: ${{ steps.configure.outputs.base_url }}
        run: |
          PAGES_URL="${PAGES_URL%/}"
          echo "Restoring previous repository state from ${PAGES_URL}"
          mkdir -p public/dist

          if ! curl -fsSL "${PAGES_URL}/dist/Packages" -o /tmp/packages-previous; then
            echo "::warning::No previous deployment found at ${PAGES_URL} — building repository from scratch."
            exit 0
          fi

          declare -A LATEST_VERSION LATEST_FILE
          while IFS=$'\t' read -r pkg ver file; do
            if [[ -z "${LATEST_VERSION[$pkg]}" ]] || dpkg --compare-versions "$ver" gt "${LATEST_VERSION[$pkg]}"; then
              LATEST_VERSION[$pkg]="$ver"
              LATEST_FILE[$pkg]="$file"
            fi
          done < <(awk '/^Package: /{pkg=$2} /^Version: /{ver=$2} /^Filename: /{print pkg "\t" ver "\t" $2}' /tmp/packages-previous)

          for file in "${LATEST_FILE[@]}"; do
            echo "Restoring ${file}"
            mkdir -p "$(dirname "public/${file}")"
            curl -fsSL "${PAGES_URL}/${file}" -o "public/${file}" || echo "::warning::Failed to restore ${file}"
          done
          CACHE_DIR="public/dist/.cache"
          mkdir -p "${CACHE_DIR}"
          for pkg in "${!LATEST_VERSION[@]}"; do
            echo "Restoring cache for ${pkg}"
            curl -fsSL "${PAGES_URL}/dist/.cache/${pkg}.sha" -o "${CACHE_DIR}/${pkg}.sha" \
              || echo "::warning::No cache found for ${pkg}"
          done

      - name: Execute builder script
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          chmod +x build-repo.sh
          ./build-repo.sh
        
      - name: Upload static artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          # We deploy the public folder generated by our build-repo.sh script
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
